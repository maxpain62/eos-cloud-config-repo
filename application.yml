spring:
  datasource:
    url: jdbc:mysql://REPLACERDS:3306/edwiki?createDatabaseIfNotExist=true
    username: eosadmin
    password: eosadmin
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate.ddl-auto: create
    show-sql: true
    generate-ddl: false
  # Producer properties
  kafka:
    bootstrap-servers: REPLACEKAFKA:9092
    group-id: group_id
topic:
  name:
    producer: ed-topic-1
    consumer: ed-topic-1
# Common Kafka Properties
auto:
  create:
    topics:
      enable: true

#AWS properties
cloud:
  aws:
    region:
      static: ap-south-1
    stack:
      auto: false
    credentials:
      accessKey: REPLACEaccessKey
      secretKey: REPLACEsecretKey

application:
  bucket:
    name: eos-s3-bubket

logging:
  level:
    com:
      amazonaws:
        util:
          EC2MetadataUtils: error

baseUrl: http://eos-gateway-api-service.eos-dev.svc.cluster.local:5555/v1
